<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStock — Categorias</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">Pro<span class="ponto">Stock</span></div>
        <nav>
            <a href="dashboard.html">Painel geral</a>
            <a href="produtos.html">Produtos</a>
            <a href="categorias.html">Categorias</a>
            <a href="venda.html">Vendas</a>
            <a href="historico-vendas.html">Histórico de vendas</a>
            <a href="movimentacoes.html">Movimentações</a>
            <a href="fornecedores.html">Fornecedores</a>
            <a href="alertas.html">Alertas</a>
            <a href="relatorios.html" class="somente-admin">Relatórios</a>
            <a href="usuarios.html" class="somente-admin">Usuários</a>
        </nav>
        <div class="rodape-sidebar">ProStock &copy; 2026</div>
    </aside>

    <main class="conteudo">
        <div class="topbar">
            <div>
                <h1>Categorias</h1>
                <div class="subtitulo">Organize os produtos por categoria</div>
            </div>
            <div class="usuario-info">
                <div>
                    <div id="usuario-nome" style="font-weight:600;"></div>
                    <div id="usuario-cargo" style="color:var(--cor-texto-suave); font-size:12px;"></div>
                </div>
                <div class="avatar" id="usuario-avatar"></div>
                <button class="btn-sair" id="btn-sair">Sair</button>
            </div>
        </div>

        <div id="mensagem" class="mensagem mensagem-erro" style="display:none;"></div>

        <div class="card somente-admin">
            <h2>Nova categoria</h2>
            <form id="form-categoria">
                <div class="form-linha">
                    <div>
                        <label for="categoria-nome">Nome</label>
                        <input type="text" id="categoria-nome" required>
                    </div>
                    <div>
                        <label for="categoria-descricao">Descrição</label>
                        <input type="text" id="categoria-descricao">
                    </div>
                </div>
                <button type="submit" class="btn">Adicionar</button>
            </form>
        </div>

        <div class="card">
            <h2>Categorias cadastradas</h2>
            <div class="tabela-scroll">
                <table>
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th class="somente-admin">Ações</th>
                    </tr>
                    </thead>
                    <tbody id="tabela-categorias"></tbody>
                </table>
            </div>
            <div id="vazio-categorias" class="vazio" style="display:none;">Nenhuma categoria cadastrada.</div>
        </div>
    </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/categorias.js"></script>
</body>
</html>
