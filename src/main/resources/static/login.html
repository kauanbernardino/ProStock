<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStock — Entrar</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="pagina-login">
    <div class="caixa-login">
        <div class="logo">Pro<span class="ponto">Stock</span></div>
        <div class="subtitulo">Gestão de estoque para autopeças</div>

        <div id="mensagem" class="mensagem mensagem-erro" style="display: none;"></div>

        <form id="form-login">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required autocomplete="username" placeholder="voce@empresa.com">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required autocomplete="current-password" placeholder="••••••••">

            <button type="submit" class="btn" id="btn-entrar">Entrar</button>
        </form>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
    document.getElementById("form-login").addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const mensagemEl = document.getElementById("mensagem");
        const botao = document.getElementById("btn-entrar");
        mensagemEl.style.display = "none";
        botao.disabled = true;
        botao.textContent = "Entrando...";

        try {
            await api.post("/api/auth/login", {
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value,
            });
            window.location.href = "/dashboard.html";
        } catch (erro) {
            mensagemEl.textContent = erro.message || "Não foi possível entrar. Verifique suas credenciais.";
            mensagemEl.style.display = "block";
        } finally {
            botao.disabled = false;
            botao.textContent = "Entrar";
        }
    });

    // Se já houver sessão ativa, pula direto para o dashboard.
    api.get("/api/auth/me").then(() => {
        window.location.href = "/dashboard.html";
    }).catch(() => {});
</script>
</body>
</html>
