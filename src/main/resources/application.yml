server:
  port: 8080

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  rotinas:
    # Verificação automática de estoque obsoleto (segundo minuto hora dia mês dia-da-semana).
    cron-obsolescencia: ${CRON_OBSOLESCENCIA:0 0 7 * * *}
  pix:
    # Os dados reais da loja NÃO ficam aqui (este arquivo vai para o Git).
    # Defina PIX_CHAVE, PIX_NOME_RECEBEDOR e PIX_CIDADE como variáveis de
    # ambiente, ou app.pix.* em config/application.properties na raiz do
    # projeto (carregado automaticamente pelo Spring Boot e ignorado pelo Git).
    chave: ${PIX_CHAVE:00000000000}
    nome-recebedor: ${PIX_NOME_RECEBEDOR:ProStock Autopecas}
    cidade: ${PIX_CIDADE:SAO PAULO}

spring:
  application:
    name: prostock

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 8h

  datasource:
    url: jdbc:postgresql://localhost:5432/prostock?currentSchema=prostock
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: prostock

logging:
  level:
    com.prostock: DEBUG
    org.hibernate.SQL: DEBUG
