server:
  port: 8080

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  pix:
    # Configure com os dados reais da loja antes de usar em produção.
    chave: ${PIX_CHAVE:00000000000}
    nome-recebedor: ${PIX_NOME_RECEBEDOR:ProStock Autopecas}
    cidade: ${PIX_CIDADE:SAO PAULO}

spring:
  application:
    name: prostock

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 8h

  datasource:
    url: jdbc:postgresql://localhost:5432/prostock?currentSchema=prostock
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: prostock

  thymeleaf:
    cache: false

logging:
  level:
    com.prostock: DEBUG
    org.hibernate.SQL: DEBUG
